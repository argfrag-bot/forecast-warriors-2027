<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forecast Warriors — 2027</title><style>
:root{--ink:#202331;--paper:#fff9e9;--red:#d9433c;--blue:#2675b8}*{box-sizing:border-box}body{margin:0;background:#c9c3b4;color:var(--ink);font-family:'Comic Sans MS','Trebuchet MS',cursive;padding:20px 12px}.sheet{max-width:650px;margin:auto;background:var(--paper);min-height:90vh;padding:34px 23px 45px;box-shadow:5px 8px 0 #9c9485;position:relative;transform:rotate(-.35deg);border:1px solid #aea18a;background-image:repeating-linear-gradient(transparent 0 35px,#a6c2d53b 36px 37px)}.rings{position:absolute;top:-12px;left:12%;right:12%;display:flex;justify-content:space-between}.rings i{display:block;width:13px;height:28px;border:3px solid #555;border-radius:12px;background:#c8c5bf}header{text-align:center;padding-top:10px}.eyebrow{font-size:13px;letter-spacing:3px;font-weight:900}h1{font-size:clamp(32px,8vw,53px);margin:7px 0 0;line-height:1;transform:rotate(-2deg)}h1 span{color:var(--blue)}.subtitle{font-size:14px;margin:10px 0 24px}h2{font-size:28px;margin:18px 0 6px;transform:rotate(-1deg)}.doodle{font-size:65px;line-height:1;filter:grayscale(.1);margin:10px auto}.scribble{color:var(--red);font-size:14px;font-weight:bold;transform:rotate(-2deg);margin:8px 0 18px}.monthgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:18px 0 24px}.month{font:inherit;font-size:15px;font-weight:bold;background:#fffdf5;border:2px solid var(--ink);border-radius:3px;padding:13px 2px;box-shadow:3px 3px 0 var(--ink);transform:rotate(var(--r));cursor:pointer}.month.active{background:#f6d77c;border-color:var(--red);box-shadow:3px 3px 0 var(--red)}.month:focus-visible,.next:focus-visible{outline:3px solid var(--blue)}.quote{border:3px solid var(--ink);padding:19px 15px 17px;background:#fffef7;transform:rotate(.5deg);position:relative;min-height:160px}.quote:before{content:'✎';position:absolute;right:10px;top:-23px;color:var(--red);font-size:36px}.quote .tag{font-size:12px;letter-spacing:2px;font-weight:bold;color:var(--red)}.quote p{font-size:clamp(20px,5vw,29px);line-height:1.28;font-weight:900;margin:15px 0}.next{background:var(--blue);color:white;border:2px solid var(--ink);font:inherit;font-weight:bold;padding:12px 17px;margin-top:16px;cursor:pointer;transform:rotate(-1deg)}footer{text-align:center;font-size:12px;margin-top:27px;opacity:.75}@media(min-width:550px){.monthgrid{grid-template-columns:repeat(4,1fr)}}@media(prefers-reduced-motion:no-preference){.quote{animation:appear .25s ease}@keyframes appear{from{opacity:.4;transform:rotate(.5deg) translateY(5px)}to{opacity:1;transform:rotate(.5deg)}}}</style></head><body><main class="sheet"><div class="rings"><i></i><i></i><i></i><i></i><i></i></div><header><div class="eyebrow">ΗΜΕΡΟΛΟΓΙΟ 2027</div><h1>FORECAST <span>WARRIORS</span></h1><p class="subtitle">12 μήνες. Άπειρα revisions. Μηδέν θαύματα.</p><div class="doodle" aria-hidden="true">🦉</div><div class="scribble">«Το forecast ήταν σωστό. Μέχρι που ήρθαν τα actuals.»</div></header><section aria-label="Επιλογή μήνα"><h2>Διάλεξε μήνα ↘</h2><div id="months" class="monthgrid"></div></section><section id="quote" class="quote" aria-live="polite"><div class="tag" id="tag"></div><p id="line"></p><div id="counter"></div></section><button class="next" id="next" type="button">Άλλη ατάκα ↻</button><footer>FORECAST WARRIORS • DEMAND PLANNING SURVIVAL NOTES</footer></main><script>
const names=['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
const quotes=[
['Νέος χρόνος, ίδιο forecast. Απλώς άλλαξε το όνομα του αρχείου.','Το S&OP cycle είναι κύκλος. Γι’ αυτό δεν τελειώνει ποτέ.','New year, new assumptions. Τα actuals δεν ενημερώθηκαν.'],
['Το consensus υπογράφηκε. Οι εξαιρέσεις ήρθαν πέντε λεπτά μετά.','Όλοι συμφωνούν με το forecast. Μέχρι να πρέπει να το τηρήσουν.','Το “approved” είναι προσωρινή ψυχική κατάσταση.'],
['Πού να σας αφήσω; Στο consensus ή στο revision;','Η διαδρομή επανυπολογίζεται. Για έβδομη φορά σήμερα.','Το GPS λέει “προορισμός”. Οι Sales λένε “άλλη μια στάση”.'],
['Houston, έχουμε απόκλιση. Η Γη λέει πως είναι promo effect.','Στο διάστημα κανείς δεν ακούει το forecast σου. Στο meeting επίσης.','Εξερευνούμε νέους πλανήτες. Τα ίδια παλιά assumptions.'],
['Δεν είμαι μάντης. Απλώς έχω Excel και κακή διαίσθηση.','Η κρυστάλλινη σφαίρα ζητά καλύτερα historical data.','Πρόβλεψη χωρίς δεδομένα; Να φέρω και τα ταρό;'],
['Άλλος για το forecast μου; Το consensus είναι ο θησαυρός που δεν βρήκαμε.','Οι πειρατές είχαν χάρτη. Εμείς έχουμε version 27_final_FINAL.','Κάθε revision κι ένα καινούριο ναυάγιο.'],
['SOS: το service level βουλιάζει. Η ζήτηση κάνει ηλιοθεραπεία.','Το stock-out δεν είναι καλοκαιρινή δραστηριότητα.','Οι Sales ζήτησαν κύματα. Το Supply έφερε τρικυμία.'],
['Φωτιά στα actuals. Το forecast παραμένει αισιόδοξο.','Αύγουστος: οι μισοί λείπουν, τα urgent είναι όλα εδώ.','Το μόνο πράγμα που δεν παίρνει άδεια είναι το revision.'],
['Λίγο trim στο forecast; Όχι, δεν θα πονέσει.','Κόβουμε τις υπερβολές. Τα assumptions αντιστέκονται.','Το forecast ήθελε φρεσκάρισμα. Του κάναμε αναδόμηση.'],
['Ψάχνοντας τα historical data, βρήκαμε και την αρχική υπόθεση.','Οκτώβριος: το budget είναι επιστημονική φαντασία με deadlines.','Ανασκαφή 2023 BC. Τα ίδια λάθη, σε καλύτερη ανάλυση.'],
['Αυτό δεν είναι forecast. Είναι ευχή με γαρνιτούρα.','Η συνταγή γράφει “λίγα assumptions”. Κάποιος έριξε όλο το βαζάκι.','Το demand φούσκωσε. Η πραγματικότητα δεν προθερμάνθηκε.'],
['Ήσουν καλός στα actuals φέτος;','Ο Άγιος Βασίλης φέρνει δώρα. Οι Sales φέρνουν επιπλέον volume.','Dear Santa: φέρε μας ένα forecast χωρίς last-minute changes.']
];
let selected=0;const buttons=document.getElementById('months'),line=document.getElementById('line'),tag=document.getElementById('tag'),counter=document.getElementById('counter');let index=0;
names.forEach((name,i)=>{const b=document.createElement('button');b.type='button';b.className='month';b.style.setProperty('--r',((i%5)-2)+'deg');b.textContent=name;b.addEventListener('click',()=>{selected=i;index=0;render()});buttons.appendChild(b)});
function render(){[...buttons.children].forEach((b,i)=>{b.classList.toggle('active',i===selected);b.setAttribute('aria-pressed',String(i===selected))});tag.textContent=names[selected].toUpperCase()+' 2027';line.textContent='«'+quotes[selected][index]+'»';counter.textContent=(index+1)+' / '+quotes[selected].length+' ατάκες'}
document.getElementById('next').addEventListener('click',()=>{index=(index+1)%quotes[selected].length;render()});const param=new URLSearchParams(location.search).get('month');if(param){const n=Number(param);if(Number.isInteger(n)&&n>=1&&n<=12)selected=n-1}render();
</script></body></html>
