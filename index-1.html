<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1931"><meta name="description" content="Forecast Warriors 2027 — 120 κυνικές ατάκες Demand Planning & S&OP"><title>Forecast Warriors 2027 | Corporate Survival Quotes</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#f6f9ff;background:#0c1931}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#234f83 0%,#0c1931 58%)}main{width:min(100%,610px);margin:auto;padding:22px 17px 38px}.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#8bd7ff;font-weight:900;letter-spacing:.08em;font-size:.82rem}.pill{border:1px solid #526c92;border-radius:50px;padding:7px 10px;font-size:.7rem;color:#f7d275;white-space:nowrap}.hero{text-align:center;margin:27px 0 18px}.owl{font-size:3.4rem;filter:drop-shadow(0 8px 12px #0006)}h1{font-size:clamp(1.65rem,7vw,2.4rem);line-height:1.05;margin:12px 0 7px;letter-spacing:-.04em}.subtitle{color:#b6cce5;font-size:.9rem;margin:0}.selectlabel{display:block;font-size:.8rem;color:#bbcee6;margin:24px 0 8px}select{width:100%;padding:13px 14px;border:1px solid #5879a4;background:#1b3151;color:white;border-radius:12px;font-size:1rem}.tagline{color:#ffcc5c;text-align:center;font-size:.86rem;font-weight:800;margin:20px 0 8px}.card{background:#1c304d;border:1px solid #4a648a;border-radius:22px;min-height:255px;display:flex;flex-direction:column;justify-content:space-between;padding:25px 22px;box-shadow:0 18px 35px #0005}.mark{font-size:2.7rem;line-height:.8;color:#ffcc5c;font-weight:900}.quote{font-size:clamp(1.2rem,5.4vw,1.65rem);font-weight:800;line-height:1.4;text-align:center;margin:18px 0;overflow-wrap:break-word}.counter{text-align:center;color:#a7bfdc;font-size:.8rem}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}button{border:0;border-radius:12px;padding:14px 10px;font-size:.91rem;font-weight:800;cursor:pointer}button.primary{background:#ffca50;color:#12213b}button.secondary{background:#2d4668;color:white;border:1px solid #6681a4}.share{margin-top:10px;width:100%;background:transparent;border:1px solid #486489;color:#d7e6f9}.foot{color:#8ea9c7;text-align:center;font-size:.7rem;margin-top:29px;letter-spacing:.06em}.notice{min-height:1.2em;text-align:center;font-size:.78rem;color:#ffda83;margin-top:8px}@media(min-width:520px){main{padding-top:35px}.card{min-height:300px}}@media(prefers-reduced-motion:no-preference){.quote{animation:appear .2s ease}@keyframes appear{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}}</style></head><body><main><header class="brand"><span>🦉 FORECAST WARRIORS</span><span class="pill">2027 EDITION</span></header><section class="hero"><div class="owl" aria-hidden="true">🦉</div><h1>CORPORATE<br>SURVIVAL QUOTES</h1><p class="subtitle">120 ατάκες. 12 μήνες. Μηδέν δικαιολογίες.</p></section><label class="selectlabel" for="month">Διάλεξε μήνα</label><select id="month"></select><p class="tagline" id="tagline"></p><article class="card"><div class="mark" aria-hidden="true">“</div><div class="quote" id="quote" aria-live="polite"></div><div class="counter" id="counter"></div></article><div class="actions"><button class="primary" id="next">↻ Άλλη ατάκα</button><button class="secondary" id="copy">⧉ Αντιγραφή</button></div><button class="share" id="share">↗ Κοινοποίηση</button><p class="notice" id="notice" role="status"></p><footer class="foot">NO FORECASTS WERE HARMED. ONLY EXPECTATIONS.</footer></main><script>
const months=[{"name": "Ιανουάριος", "theme": "S&OP ZEN", "tagline": "ΜΗ ΜΟΥ ΤΟΥΣ ΚΥΚΛΟΥΣ ΤΑΡΑΤΤΕ!", "quotes": ["Το S&OP φέρνει όλους στο ίδιο τραπέζι. Την ίδια άποψη, ποτέ.", "Το consensus ξεκινά όταν τελειώνουν τα επιχειρήματα και αρχίζει το meeting.", "Κρατάω την ψυχραιμία μου. Το forecast όχι.", "Κάθε S&OP cycle είναι μια νέα ευκαιρία να ξανασυζητήσουμε τα ίδια.", "Το action log είναι το νεκροταφείο των καλών προθέσεων.", "Στο Demand Review όλοι έχουν άποψη. Στο follow-up όλοι έχουν άδεια.", "Η ευθυγράμμιση ολοκληρώθηκε. Οι αριθμοί εξακολουθούν να διαφωνούν.", "Το meeting είχε ξεκάθαρο outcome: άλλο ένα meeting.", "Ο κύκλος S&OP κλείνει. Ο κύκλος των αλλαγών ποτέ.", "Δεν χρειάζομαι διαλογισμό. Χρειάζομαι frozen forecast."]}, {"name": "Φεβρουάριος", "theme": "CONSENSUS COURT", "tagline": "ΥΠΑΡΧΕΙ ΥΠΟΓΕΓΡΑΜΜΕΝΟ CONSENSUS!", "quotes": ["Το consensus είναι συλλογικό. Η ευθύνη ατομική.", "Υπογράψαμε το forecast. Μετά το Sales θυμήθηκε κάτι.", "Το εγκεκριμένο forecast έχει ημερομηνία λήξης: το επόμενο email.", "Στη δίκη του bias, όλοι δηλώνουν αθώοι.", "Το consensus είναι ιερό. Μέχρι να μιλήσει ο μεγάλος πελάτης.", "Το «approved» σημαίνει «μην το αλλάξεις χωρίς να με ενημερώσεις».", "Όλοι συμφώνησαν. Κανείς δεν θυμάται σε τι.", "Το πρακτικό γράφει απόφαση. Το Excel γράφει άλλη ιστορία.", "Το override εγκρίθηκε ομόφωνα από όσους δεν θα το μετρήσουν.", "Ο δικαστής αποφάσισε: φταίνε τα actuals που δεν ακολούθησαν το plan."]}, {"name": "Μάρτιος", "theme": "REVISION TAXI", "tagline": "CONSENSUS Ή REVISION;", "quotes": ["Το final forecast είναι final μέχρι να ανοίξει το Sales το Excel.", "Κάναμε 12 revisions και επιστρέψαμε στην πρώτη έκδοση.", "Ο πιο σύντομος δρόμος προς το consensus περνά από τρία detours.", "Το «μια μικρή αλλαγή» είναι μονάδα μέτρησης κινδύνου.", "Το forecast freeze είναι περισσότερο ευχή παρά διαδικασία.", "Στο revision δεν υπάρχει τέρμα. Μόνο επόμενη στάση.", "Το Sales ζήτησε express αλλαγή. Τα δεδομένα έρχονται με τα πόδια.", "Το version control είναι το μόνο που θυμάται ποιος άλλαξε τι.", "Το baseline πήγε ευθεία. Οι overrides πήραν περιφερειακό.", "Προορισμός: consensus. Εκτιμώμενη άφιξη: μετά το budget."]}, {"name": "Απρίλιος", "theme": "HOUSTON, WE HAVE A BIAS", "tagline": "HOUSTON, ΕΧΟΥΜΕ ΑΠΟΚΛΙΣΗ!", "quotes": ["Το forecast ήταν ακριβές. Η πραγματικότητα δεν συνεργάστηκε.", "Το bias μας είναι σταθερό. Τουλάχιστον κάτι είναι προβλέψιμο.", "Η απόκλιση είναι μικρή, αν αλλάξεις την κλίμακα του γραφήματος.", "Houston, το MAPE δεν δέχεται δικαιολογίες.", "Το actual πήγε σε άλλο γαλαξία χωρίς να ενημερώσει.", "Η πρόβλεψη απογειώθηκε. Η ακρίβεια έμεινε στο έδαφος.", "Το outlier ήταν απρόβλεπτο. Όπως και τα προηγούμενα έξι.", "Όταν το forecast αστοχεί, το PowerPoint πετυχαίνει.", "Δεν χάσαμε το target. Ανακαλύψαμε νέο εύρος αβεβαιότητας.", "Το μόνο σταθερό στο demand είναι ότι θα αλλάξει."]}, {"name": "Μάιος", "theme": "THE FORECAST ORACLE", "tagline": "ΔΕΝ ΕΙΜΑΙ ΜΑΝΤΗΣ, ΜΑΝΤΑΜ!", "quotes": ["Αν ήξερα το μέλλον, δεν θα το παρουσίαζα σε PowerPoint.", "Η κρυστάλλινη σφαίρα έχει λιγότερα assumptions από το budget.", "Το forecast δεν είναι μαντεία. Απλώς μερικοί το αντιμετωπίζουν έτσι.", "Βλέπω μεγάλη ανάπτυξη. Δυστυχώς, μόνο στο inventory.", "Τα δεδομένα δείχνουν τάση. Η διοίκηση βλέπει θαύμα.", "Το «τι πιστεύεις ότι θα γίνει;» δεν είναι forecasting methodology.", "Προβλέπω άλλο ένα αίτημα για μεγαλύτερη ακρίβεια με λιγότερα δεδομένα.", "Το μοντέλο έχει confidence interval. Το management μόνο confidence.", "Η πρόβλεψη του μήνα: θα φταίει ο planner.", "Δεν έχω μαγικές δυνάμεις. Έχω pivot tables και υπομονή."]}, {"name": "Ιούνιος", "theme": "PIRATE FORECAST", "tagline": "ΑΛΛΟΣ ΓΙΑ ΤΟ FORECAST ΜΟΥ;", "quotes": ["Κάθε forecast κρύβει θησαυρό. Συνήθως μια ατεκμηρίωτη παραδοχή.", "Βρήκαμε το χαμένο assumption. Δεν ξέρουμε ποιος το έβαλε.", "Το μόνο χρυσάφι στο forecast είναι το αρχείο με σωστά actuals.", "Το Sales ζητά περισσότερο volume. Ο πειρατής λιγότερα λάφυρα.", "Χάρτης θησαυρού: πέντε tabs, δεκαεπτά links, κανένα owner.", "Το forecast δεν κλάπηκε. Απλώς το άλλαξαν χωρίς ενημέρωση.", "Αναζητείται η πηγή του +30%. Αμοιβή: ένα ήσυχο κλείσιμο μήνα.", "Το baseline είναι στο σεντούκι. Το κλειδί το έχει το Marketing.", "Όποιος βρει το τελευταίο approved version, κρατάει τον θησαυρό.", "Σαλπάρουμε για consensus. Ο άνεμος φυσάει προς revision."]}, {"name": "Ιούλιος", "theme": "SERVICE LEVEL RESCUE", "tagline": "ΤΟ SERVICE LEVEL ΒΟΥΛΙΑΖΕΙ!", "quotes": ["Το service level πέφτει. Η πίεση ανεβαίνει. Το stock αγνοείται.", "Σώσαμε το service level. Το working capital ζητά δικηγόρο.", "Το safety stock είναι περιττό μέχρι να χρειαστεί.", "Η διαθεσιμότητα είναι εξαιρετική στα προϊόντα που δεν ζητά κανείς.", "Το stockout ήρθε απρόσμενα. Είχε προαναγγελθεί σε τρία meetings.", "Το service level έχει στόχο 98%. Η πραγματικότητα έχει άλλα σχέδια.", "Κάθε χαμένη πώληση γεννά μια νέα εξήγηση.", "Αν το inventory ήταν διακοπές, το service level θα είχε πνιγεί.", "Ο πελάτης ζητά προϊόν. Εμείς του στέλνουμε root cause analysis.", "Η ζήτηση κολυμπά. Η παραγωγή ψάχνει σωσίβιο."]}, {"name": "Αύγουστος", "theme": "FORECAST FIREFIGHTER", "tagline": "ΦΩΤΙΑ ΣΤΑ ACTUALS!", "quotes": ["Το επείγον του Sales είναι συνήθως το ξεχασμένο του προηγούμενου μήνα.", "Έσβησα τη φωτιά. Το Teams άναψε άλλη.", "Το forecast έχει καεί. Το deadline παραμένει άθικτο.", "Τον Αύγουστο όλοι λείπουν. Εκτός από τα exceptions.", "Κάθε ad hoc request έρχεται με τη λέξη «μόνο».", "Το crisis management είναι το ανεπίσημο όνομα του daily planning.", "Το «θα το δούμε μετά τις διακοπές» δεν ισχύει για τα actuals.", "Η φωτιά ξεκίνησε από ένα «βάλε λίγο παραπάνω».", "Το μόνο πράγμα που ανανεώνεται πιο συχνά από το forecast είναι τα urgent emails.", "Πυροσβεστήρας για τις αποκλίσεις δεν υπάρχει. Μόνο νέο scenario."]}, {"name": "Σεπτέμβριος", "theme": "FORECAST HAIR SALON", "tagline": "ΛΙΓΟ TRIM ΣΤΟ FORECAST;", "quotes": ["Κουρέψαμε το forecast. Τώρα δεν συμφωνεί με τις φιλοδοξίες.", "Το bias θέλει κούρεμα. Το budget θέλει extensions.", "Αφαιρέσαμε τα outliers. Το πρόβλημα έμεινε.", "Το forecast ζήτησε φυσικό αποτέλεσμα. Το Sales ζήτησε όγκο.", "Το trim έγινε. Ακολουθεί έκτακτο meeting αποκατάστασης.", "Στο κομμωτήριο κόβουμε τις υπερβολές. Στο budget τις βάφουμε ανάπτυξη.", "Μην πειράζεις το baseline. Έχει ήδη περάσει πολλά.", "Το «λίγο πιο πάνω» δεν είναι τεχνική πρόβλεψης.", "Ένα καλό forecast δεν χρειάζεται λακ αισιοδοξίας.", "Η μόνη τάση που δεν φεύγει είναι τα last-minute overrides."]}, {"name": "Οκτώβριος", "theme": "BUDGET ARCHAEOLOGY", "tagline": "ΨΑΧΝΟΝΤΑΣ ΤΑ HISTORICAL DATA!", "quotes": ["Το budget είναι το forecast που δεν επιτρέπεται να κάνει λάθος.", "Ανακαλύψαμε παραδοχή του 2023. Τη βαφτίσαμε στρατηγική 2027.", "Τα historical data είναι χρήσιμα. Όταν συμφωνούν με τον στόχο.", "Κάθε budget season ξεθάβουμε τις ίδιες αισιόδοξες υποθέσεις.", "Η αρχαιολογία θέλει υπομονή. Το budget θέλει +20%.", "Το Excel δεν λέει ψέματα. Απλώς το ρωτάμε ό,τι μας συμφέρει.", "Το growth assumption βρέθηκε σε ένα ξεχασμένο slide.", "Όλοι θέλουν ρεαλιστικό forecast μέχρι να δουν τους αριθμούς.", "Σκάψαμε στα actuals. Βρήκαμε αποκλίσεις και παλιά excuses.", "Το περσινό stretch target είναι φέτος το νέο baseline."]}, {"name": "Νοέμβριος", "theme": "FORECAST MASTERCHEF", "tagline": "ΕΥΧΗ ΜΕ ΓΑΡΝΙΤΟΥΡΑ!", "quotes": ["Βάλε λίγο history, δύο promos και μισό κιλό αισιοδοξία. Έτοιμο το forecast.", "Το forecast μας έχει όλα τα υλικά. Εκτός από τεκμηρίωση.", "Το Sales πρόσθεσε ζήτηση χωρίς να κοιτάξει τη συνταγή.", "Αν το forecast δεν βγαίνει, πρόσθεσε ένα management override.", "Το πιάτο είναι εξαιρετικό. Το MAPE έχει αντίρρηση.", "Σερβίρουμε consensus με συνοδευτικό revision.", "Η συνταγή γράφει actuals. Η κουζίνα χρησιμοποιεί wishful thinking.", "Το demand spike δεν είναι μπαχαρικό. Μην το βάζεις παντού.", "Η κριτική επιτροπή ζητά περισσότερη ανάπτυξη και λιγότερο stock.", "Το forecast κάηκε. Τουλάχιστον η παρουσίαση ήταν καλοστημένη."]}, {"name": "Δεκέμβριος", "theme": "S&OP SANTA", "tagline": "ΗΡΘΑΝ ΤΑ ACTUALS!", "quotes": ["Ο Άγιος Βασίλης πιστεύει στα θαύματα. Το Finance ζητά actuals.", "Φέτος ήμασταν καλά παιδιά. Τα forecast errors διαφωνούν.", "Στη λίστα των άτακτων μπήκαν όλα τα last-minute overrides.", "Το μόνο δώρο που ζητά ο planner είναι ένα μήνα χωρίς revision.", "Τα actuals ήρθαν. Κανείς δεν θέλει να ανοίξει το πακέτο.", "Το Sales ζήτησε δώρο +25% volume. Χωρίς επιπλέον stock.", "Το forecast του Δεκεμβρίου είναι γεμάτο εκπλήξεις. Καμία ευχάριστη.", "Ο Santa έχει λίστα. Εμείς έχουμε version history.", "Το S&OP κλείνει για τις γιορτές. Τα urgent requests όχι.", "Καλή χρονιά. Το bias ανανεώθηκε αυτόματα."]}];
const sel=document.getElementById('month'),quote=document.getElementById('quote'),counter=document.getElementById('counter'),tagline=document.getElementById('tagline'),notice=document.getElementById('notice');
months.forEach((m,i)=>{const o=document.createElement('option');o.value=i+1;o.textContent=String(i+1).padStart(2,'0')+' · '+m.name+' — '+m.theme;sel.appendChild(o)});
const query=new URLSearchParams(location.search);let month=Math.max(1,Math.min(12,Number.parseInt(query.get('month'),10)||1)),idx=0;
function render(){sel.value=month;tagline.textContent=months[month-1].theme+' · '+months[month-1].tagline;quote.textContent=months[month-1].quotes[idx];counter.textContent=(idx+1)+' / 10';notice.textContent='';}
function setMonth(m){month=m;idx=0;const u=new URL(location.href);u.searchParams.set('month',month);history.replaceState(null,'',u);render()}
sel.addEventListener('change',()=>setMonth(Number(sel.value)));
document.getElementById('next').addEventListener('click',()=>{idx=(idx+1)%10;render()});
const content=()=>quote.textContent+'\n— Forecast Warriors 2027';
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(content());notice.textContent='Η ατάκα αντιγράφηκε!'}catch(e){notice.textContent='Δεν ήταν δυνατή η αντιγραφή σε αυτόν τον browser.'}});
document.getElementById('share').addEventListener('click',async()=>{if(navigator.share){try{await navigator.share({title:'Forecast Warriors 2027',text:content(),url:location.href})}catch(e){}}else{try{await navigator.clipboard.writeText(content()+'\n'+location.href);notice.textContent='Αντιγράφηκε για κοινοποίηση!'}catch(e){notice.textContent='Χρησιμοποίησε την Αντιγραφή.'}}});render();
</script></body></html>
